dependencies:
  idf: ">=5.5.4"

  common:
    path: "../libraries/common"

  cpp_bus_driver:
    override_path: "../libraries/cpp_bus_driver"

  lilygo_device_driver:
    override_path: "../libraries/lilygo_device_driver"

  espressif/esp_video:
    override_path: "../libraries/esp-video-components/esp_video"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} == "screen_camera"'

  lvgl/lvgl:
    version: "9.5.0"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} in ["screen_lvgl", "screen_lvgl_touch_draw"]'

  espressif/esp_hosted:
    override_path: "../libraries/esp_hosted"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} in ["wifi_mp3", "wifi_scan_connect_time", "network_adapter_update", "ota_update"]'

  espressif/esp_wifi_remote:
    version: ">=1.6.1,<2.0"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} in ["wifi_mp3", "wifi_scan_connect_time", "network_adapter_update", "ota_update"]'

  espressif/esp_audio_codec:
    version: "2.4.1"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} in ["sd_mp3", "wifi_mp3"]'

  joltwallet/littlefs:
    version: ">=1.21.0,<2.0.0"
    matches:
      - if: '$CONFIG{EXAMPLE_BUILD_NAME} in ["network_adapter_update", "ota_update"]'
